; DALHAL on plain ESP-IDF (no Arduino core), see README.md in this folder
;
; PlatformIO is only used as a convenient way to get ESP-IDF and its toolchain,
; the build itself is the normal ESP-IDF CMake build (CMakeLists.txt, main/, components/),
; so the same folder also builds with idf.py when ESP-IDF is installed on its own.
;
; build:  pio run -d targets/esp-idf
; flash:  pio run -d targets/esp-idf -t upload

[platformio]
src_dir = main
default_envs = esp32dev

[env]
; official platformio/platform-espressif32 (not pioarduino), ESP-IDF 5.5
platform = https://github.com/platformio/platform-espressif32.git#3c076807e1f55b90799b50b946e76a0508e97778
framework = espidf
monitor_speed = 115200
; regenerates the embedded frontend when www/ changed (cmake only runs it when it reconfigures)
extra_scripts = pre:../../tools/gen_frontend.py

[env:esp32dev]
board = esp32dev
board_build.partitions = ../../partitions_32mbit.csv
