; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env]
; generates FrontendFiles/Generated/ from FrontendFiles/www/ (gzip where it helps)
extra_scripts = pre:tools/gen_frontend.py
;src_dir = .

[env:pc_sim]
platform = native
build_flags = 
	-std=c++17
	-I../src
	-I../pc_simulation
	-D PC_SIM
lib_deps =
build_src_filter =
	-<*>
    +<src/>
    +<pc_simulation/>    

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
monitor_speed = 115200
build_flags = 
    -Isecrets
	-D ESP01_1M
lib_deps = 
	WifiManager
	WS2812FX
	adafruit/Adafruit SSD1306@^2.4.5
	adafruit/Adafruit BusIO@^1.7.3
	adafruit/Adafruit Unified Sensor@^1.1.14
	beegee-tokyo/DHT sensor library for ESPx@^1.19
	milesburton/DallasTemperature@^3.11.0
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/manicken/TimeAlarms.git
	paulstoffregen/Time@^1.6.1
	fmtlib/fmt@^8.1.1
	esphome/ESPAsyncWebServer-esphome@^3.3.0

[env:esp07]
platform = espressif8266
board = esp07
framework = arduino
upload_port = 192.168.1.128
build_flags = 
    -Wl,-Teagle.flash.1m128.ld
	-Isecrets
	-D ESP07
monitor_speed = 115200
lib_deps = 
	WifiManager
	WS2812FX
	SPI
	adafruit/Adafruit SSD1306@^2.4.5
	adafruit/Adafruit BusIO@^1.7.3
	adafruit/Adafruit Unified Sensor@^1.1.14
	beegee-tokyo/DHT sensor library for ESPx@^1.19
	milesburton/DallasTemperature@^3.11.0
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/manicken/TimeAlarms.git
	paulstoffregen/Time@^1.6.1
	fmtlib/fmt@^8.1.1
	esphome/ESPAsyncWebServer-esphome@^3.3.0

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
upload_port = COM5
upload_speed = 3000000
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.flash_mode = qio
build_flags = 
    -Wl,-Teagle.flash.4m2m.ld
	;-fexceptions
	-Isecrets
	-D ESP12E
	-g3
  -O2
  -fno-rtti
  ;-fno-omit-frame-pointer
  -fno-optimize-sibling-calls
  -Wl,-Map,output.map
  
lib_deps = 
	WifiManager
	WS2812FX
	SPI
	adafruit/Adafruit SSD1306@^2.4.5
	adafruit/Adafruit BusIO@^1.7.3
	beegee-tokyo/DHT sensor library for ESPx@^1.19
	milesburton/DallasTemperature@^3.11.0
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/manicken/TimeAlarms.git
	paulstoffregen/Time@^1.6.1
	fmtlib/fmt@^8.1.1
	esphome/ESPAsyncWebServer-esphome@^3.3.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
upload_port = COM4
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.flash_mode = qio
build_unflags =
    -std=gnu++11
    -std=gnu++14

build_flags = 
	-std=gnu++17
	;-fexceptions
	-Isecrets
	-D ESP32DEV
board_build.sdkconfig = sdkconfig.defaults
board_build.partitions = partitions_32mbit.csv
lib_deps = 
	WifiManager
	WS2812FX
	SPI
	adafruit/Adafruit SSD1306@^2.4.5
	adafruit/Adafruit BusIO@^1.7.3
	beegee-tokyo/DHT sensor library for ESPx@^1.19
	milesburton/DallasTemperature@^3.11.0
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/manicken/TimeAlarms.git
	paulstoffregen/Time@^1.6.1
	fmtlib/fmt@^8.1.1
	esphome/ESPAsyncWebServer-esphome@^3.3.0

